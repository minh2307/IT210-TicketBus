<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout-admin}">
<head>
    <title>Quản lý tuyến đường</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>Quản lý tuyến đường</h3>
            <a th:href="@{/admin/routes/new}" class="btn btn-danger">
                <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                Thêm tuyến đường mới
            </a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
            <div th:if="${param.success == 'created'}">Thêm tuyến đường thành công!</div>
            <div th:if="${param.success == 'updated'}">Cập nhật tuyến đường thành công!</div>
            <div th:if="${param.success == 'deleted'}">Xóa tuyến đường thành công!</div>
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${param.error}"></span>
            <button type="button" class="close" data-dismiss="alert">
                <span>&times;</span>
            </button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Điểm đi</th>
                                <th>Điểm đến</th>
                                <th>Khoảng cách</th>
                                <th class="text-right">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="route, iterStat : ${routes}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td class="font-weight-bold text-success" th:text="${route.origin.name}"></td>
                                <td class="font-weight-bold text-info" th:text="${route.destination.name}"></td>
                                <td>
                                    <span class="code-cell" th:text="${route.distance}"></span>
                                    <small class="text-muted">km</small>
                                </td>
                                <td>
                                    <div class="action-cell">
                                        <a th:href="@{/admin/routes/edit/{id}(id=${route.id})}" 
                                           class="btn-action btn-edit" title="Chỉnh sửa">
                                            <i data-lucide="edit" style="width: 16px; height: 16px;"></i>
                                        </a>
                                        <form th:action="@{/admin/routes/delete/{id}(id=${route.id})}" 
                                              method="POST" style="display: inline;">
                                            <button type="submit" class="btn-action btn-delete" 
                                                    title="Xóa" onclick="return confirm('Bạn có chắc chắn muốn xóa tuyến đường này?')">
                                                <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
