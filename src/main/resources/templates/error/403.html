<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truy cập bị từ chối - TicketBus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #c0392b;
            --primary-hover: #a93226;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .error-container {
            text-align: center;
            background: white;
            padding: 3.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .error-container:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            background-color: #fff5f5;
            color: var(--primary-color);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
        }

        h2 {
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 1rem;
        }

        p {
            color: #636e72;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
            box-shadow: 0 8px 15px rgba(192, 57, 43, 0.2);
        }

        .btn-outline {
            border: 2px solid #dfe6e9;
            color: #636e72;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
            text-decoration: none;
        }

        .btn-outline:hover {
            background-color: #f1f2f6;
            color: #2d3436;
            border-color: #b2bec3;
            text-decoration: none;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="icon-box">
            <i data-lucide="shield-alert" style="width: 50px; height: 50px;"></i>
        </div>
        <div class="error-code">401</div>
        <h2>Truy cập bị từ chối</h2>
        <p>
            Rất tiếc! Bạn không có quyền hạn để truy cập vào trang này.
            Vui lòng kiểm tra lại tài khoản hoặc liên hệ quản trị viên.
        </p>

        <div class="actions">
            <a th:if="${session.user != null}" th:href="@{/}" class="btn btn-primary d-flex align-items-center">
                <i data-lucide="home" class="mr-2" style="width: 18px; height: 18px;"></i>
                Về trang chủ
            </a>
            <a th:if="${session.user == null}" th:href="@{/auth/login}"
                class="btn btn-primary d-flex align-items-center">
                <i data-lucide="log-in" class="mr-2" style="width: 18px; height: 18px;"></i>
                Đăng nhập ngay
            </a>
            <a href="javascript:history.back()" class="btn-outline d-flex align-items-center">
                <i data-lucide="arrow-left" class="mr-2" style="width: 18px; height: 18px;"></i>
                Quay lại
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
