<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lỗi - TicketBus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f5f7fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px 0;
        }
        .error-card { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 500px; 
            text-align: center;
        }
        .brand { 
            color: #c0392b; 
            font-weight: 700; 
            font-size: 1.5rem; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .error-icon {
            color: #c0392b;
            margin-bottom: 20px;
        }
        .btn-primary { 
            background-color: #c0392b; 
            border-color: #c0392b; 
        }
        .btn-primary:hover { 
            background-color: #96281b; 
            border-color: #96281b; 
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="brand d-flex justify-content-center align-items-center">
            <i data-lucide="bus" class="mr-2"></i> TicketBus
        </div>
        
        <div class="error-icon">
            <i data-lucide="alert-circle" style="width: 64px; height: 64px;"></i>
        </div>
        
        <h4 class="mb-3">
            <span th:if="${status}" th:text="${status} + ' - '"></span>
            Đã xảy ra lỗi
        </h4>
        
        <div class="alert alert-danger text-left">
            <p class="mb-0" th:text="${error != null ? error : 'Đã xảy ra lỗi không mong muốn. Vui lòng thử lại sau.'}"></p>
        </div>

        <div th:if="${exception}" class="text-left mt-3 mb-4">
            <button class="btn btn-sm btn-link p-0 text-muted" type="button" data-toggle="collapse" data-target="#technicalDetails" aria-expanded="false">
                <i data-lucide="chevron-right" style="width: 14px; height: 14px;"></i> Chi tiết kỹ thuật
            </button>
            <div class="collapse mt-2" id="technicalDetails">
                <div class="card card-body bg-light border-0 py-2 px-3" style="font-size: 0.85rem;">
                    <code class="text-secondary" th:text="${exception}"></code>
                </div>
            </div>
        </div>
        
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a th:href="@{/}" class="btn btn-primary m-1">
                <i data-lucide="home" style="width: 16px; height: 16px; margin-right: 8px;"></i>
                Về trang chủ
            </a>
            <a th:href="@{/auth/login}" class="btn btn-outline-primary m-1">
                <i data-lucide="log-in" style="width: 16px; height: 16px; margin-right: 8px;"></i>
                Đăng nhập
            </a>
            <a th:href="@{/auth/register}" class="btn btn-outline-secondary m-1">
                <i data-lucide="user-plus" style="width: 16px; height: 16px; margin-right: 8px;"></i>
                Đăng ký
            </a>
        </div>
    </div>
    
    <script>lucide.createIcons();</script>
</body>
</html>
