<!-- === auth/login.html === -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TicketBus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .brand { color: #c0392b; font-weight: 700; font-size: 1.5rem; text-align: center; margin-bottom: 30px; }
        .btn-primary { background-color: #c0392b; border-color: #c0392b; }
        .btn-primary:hover { background-color: #96281b; border-color: #96281b; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand d-flex justify-content-center align-items-center">
            <i data-lucide="bus" class="mr-2"></i> TicketBus
        </div>
        <h4 class="text-center mb-4">Đăng nhập</h4>
        
        <div th:if="${param.error}" class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất thành công.</div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        
        <form th:action="@{/auth/login}" method="POST" th:object="${loginRequest}">
            <div class="form-group">
                <label>Email hoặc số điện thoại</label>
                <input type="text" th:field="*{emailOrPhone}" class="form-control" placeholder="Nhập tài khoản của bạn">
                <div th:if="${#fields.hasErrors('emailOrPhone')}" class="text-danger small" th:errors="*{emailOrPhone}"></div>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Nhập mật khẩu">
                <div th:if="${#fields.hasErrors('password')}" class="text-danger small" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">Đăng nhập</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-muted">Chưa có tài khoản?</span> <a th:href="@{/auth/register}" style="color: #c0392b; font-weight: 500;">Đăng ký</a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
