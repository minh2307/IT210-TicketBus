<!-- === auth/register.html === -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - TicketBus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px 0;}
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        .brand { color: #c0392b; font-weight: 700; font-size: 1.5rem; text-align: center; margin-bottom: 30px; }
        .btn-primary { background-color: #c0392b; border-color: #c0392b; }
        .btn-primary:hover { background-color: #96281b; border-color: #96281b; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand d-flex justify-content-center align-items-center">
            <i data-lucide="bus" class="mr-2"></i> TicketBus
        </div>
        <h4 class="text-center mb-4">Đăng ký tài khoản</h4>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/auth/register}" method="POST" th:object="${registerRequest}">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A">
                <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small" th:errors="*{fullName}"></div>
            </div>
            <div class="row">
                <div class="form-group col-md-6">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com">
                    <div th:if="${#fields.hasErrors('email')}" class="text-danger small" th:errors="*{email}"></div>
                </div>
                <div class="form-group col-md-6">
                    <label>Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="0912345678">
                    <div th:if="${#fields.hasErrors('phone')}" class="text-danger small" th:errors="*{phone}"></div>
                </div>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Tạo mật khẩu">
                <div th:if="${#fields.hasErrors('password')}" class="text-danger small" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu">
                <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small" th:errors="*{confirmPassword}"></div>
            </div>
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, phường, quận, thành phố">
                <div th:if="${#fields.hasErrors('address')}" class="text-danger small" th:errors="*{address}"></div>
            </div>
                        <input type="hidden" name="role" value="PASSENGER">
            <button type="submit" class="btn btn-primary btn-block mt-4">Tạo tài khoản</button>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-muted">Đã có tài khoản?</span> <a th:href="@{/auth/login}" style="color: #c0392b; font-weight: 500;">Đăng nhập</a>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
