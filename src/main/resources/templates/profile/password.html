<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Bus Ticket Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/lucide@latest/dist/umd/lucide.js">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .password-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 2.5rem;
            max-width: 450px;
            width: 100%;
        }
        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .card-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card-header p {
            color: #666;
            margin: 0;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        .form-group label {
            font-weight: 500;
            color: #555;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            padding: 0.75rem 3rem 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-icon {
            position: absolute;
            right: 1rem;
            top: 2.5rem;
            color: #999;
            cursor: pointer;
            z-index: 10;
        }
        .input-icon:hover {
            color: #667eea;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 500;
        }
        .alert {
            border-radius: 8px;
            border: none;
            font-weight: 500;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="password-card">
        <div class="card-header">
            <h2>Đổi mật khẩu</h2>
            <p>Vui lòng nhập mật khẩu hiện tại và mật khẩu mới</p>
        </div>

        <!-- Flash messages -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/profile/password}" method="POST">
            <div class="form-group">
                <label for="oldPassword">Mật khẩu hiện tại</label>
                <input type="password" id="oldPassword" name="oldPassword" class="form-control">
                <i class="input-icon" data-lucide="eye" onclick="togglePassword('oldPassword', this)"></i>
            </div>

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" 
                       minlength="8" oninput="checkPasswordStrength()">
                <i class="input-icon" data-lucide="eye" onclick="togglePassword('newPassword', this)"></i>
                <small class="form-text text-muted">Mật khẩu phải có ít nhất 8 ký tự</small>
                <div id="passwordStrength" class="mt-2"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control">
                <i class="input-icon" data-lucide="eye" onclick="togglePassword('confirmPassword', this)"></i>
                <div id="passwordMatch" class="mt-1"></div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/profile/view}" class="btn btn-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
            </div>
        </form>

        <div class="back-link">
            <a th:href="@{/profile/view}">← Quay lại hồ sơ</a>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();

        function togglePassword(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            const icon = iconElement;
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                field.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.innerHTML = '';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const strengthText = ['Yếu', 'Trung bình', 'Khá', 'Mạnh', 'Rất mạnh'][strength];
            const strengthColor = ['#dc3545', '#ffc107', '#28a745', '#17a2b8', '#007bff'][strength];
            
            strengthDiv.innerHTML = `<small style="color: ${strengthColor}">Độ mạnh: ${strengthText}</small>`;
        }

        // Check password match
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = this.value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (confirmPassword.length === 0) {
                matchDiv.innerHTML = '';
            } else if (newPassword === confirmPassword) {
                matchDiv.innerHTML = '<small style="color: #28a745">✓ Mật khẩu khớp</small>';
            } else {
                matchDiv.innerHTML = '<small style="color: #dc3545">✗ Mật khẩu không khớp</small>';
            }
        });

        // Form validation before submit
        document.querySelector('form').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                alert('Mật khẩu mới và xác nhận mật khẩu không khớp!');
            }
        });
    </script>
</body>
</html>
