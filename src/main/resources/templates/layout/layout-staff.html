<!-- === layout/layout-staff.html === -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - TicketBus Staff">TicketBus Staff</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/staff-layout.css}">

    <style layout:fragment="custom-css"></style>
    <style>
        :root {
            --bg-card: #1a1d27;
            --border-color: rgba(255,255,255,0.08);
            --radius-md: 12px;
            --radius-sm: 8px;
            --sidebar-active: #e74c3c;
            --text-primary: #f8f9fa;
            --text-muted: #a0a3b1;
        }

        /* Global Theme Fixes */
        body {
            background-color: #0f1117 !important;
            color: var(--text-primary) !important;
        }

        /* Card & Containers */
        .card {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2) !important;
        }
        .card-header {
            background: rgba(255,255,255,0.02) !important;
            border-bottom: 1px solid var(--border-color) !important;
            padding: 16px 24px;
        }
        .card-header h5, .card-header h3 {
            margin-bottom: 0;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary) !important;
        }

        /* Tables */
        .table {
            color: var(--text-primary) !important;
            margin-bottom: 0;
            background: transparent !important;
        }
        .table thead th {
            background: rgba(255,255,255,0.03) !important;
            border-bottom: 1px solid var(--border-color) !important;
            border-top: none !important;
            color: var(--text-muted) !important;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 20px;
        }
        .table td {
            border-bottom: 1px solid var(--border-color) !important;
            padding: 16px 20px;
            vertical-align: middle;
            font-size: 14px;
            color: var(--text-primary) !important;
        }
        .table tbody tr:hover {
            background-color: rgba(255,255,255,0.04) !important;
            transition: background 0.2s ease;
        }

        /* List Groups */
        .list-group {
            background: transparent !important;
        }
        .list-group-item {
            background-color: transparent !important;
            border-color: var(--border-color) !important;
            color: var(--text-primary) !important;
            padding: 15px 24px;
        }
        .list-group-item:hover {
            background-color: rgba(255,255,255,0.03) !important;
        }

        /* Utility Overrides */
        .bg-white { background-color: var(--bg-card) !important; }
        .text-dark { color: var(--text-primary) !important; }
        .border-light { border-color: var(--border-color) !important; }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="staff-sidebar" id="staffSidebar">
        <div class="sidebar-header">
            <i data-lucide="bus" class="logo-icon" style="width:28px;height:28px"></i>
            <h2>TICKETBUS</h2>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group">
                <div class="nav-group-label">Chính</div>
                <a th:href="@{/staff/dashboard}" class="sidebar-link">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
            </div>

            <div class="nav-group" style="margin-top:24px">
                <div class="nav-group-label">Quản lý vé</div>
                <a th:href="@{/staff/tickets}" class="sidebar-link">
                    <i data-lucide="ticket"></i>
                    <span>Danh sách vé</span>
                </a>
                <a th:href="@{/staff/checkin}" class="sidebar-link">
                    <i data-lucide="scan-line"></i>
                    <span>Check-in</span>
                </a>
            </div>

            <div class="nav-group" style="margin-top:24px">
                <div class="nav-group-label">Hệ thống</div>
                <a th:href="@{/staff/reports}" class="sidebar-link">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Báo cáo</span>
                </a>
                <a th:href="@{/}" class="sidebar-link">
                    <i data-lucide="external-link"></i>
                    <span>Về trang chủ</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info" th:if="${session.user != null}">
                <div class="user-avatar" th:text="${#strings.substring(session.user.fullName, 0, 1)}">U</div>
                <div class="user-details">
                    <span class="user-name" th:text="${session.user.fullName}">Staff Name</span>
                    <span class="user-role">Nhân viên</span>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="POST">
                <button type="submit" class="btn-logout">
                    <i data-lucide="log-out"></i>
                    <span>Đăng xuất</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <main class="content-body" layout:fragment="content"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <th:block layout:fragment="custom-js"></th:block>

    <script>
        // Set active state for sidebar links based on current URL
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const sidebarLinks = document.querySelectorAll('.sidebar-link');
            
            // Loop through all links and check if the current path starts with the link's href
            sidebarLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href !== '/' && currentPath.startsWith(href)) {
                    link.classList.add('active');
                } else if (href === '/' && currentPath === '/') {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>

</html>
