<!-- === fragments/nav-user.html === -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-md navbar-dark sticky-top" id="userNavbar" style="background-color: #c0392b; transition: box-shadow 0.3s;">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i data-lucide="bus" class="mr-2"></i>
            <strong>TicketBus</strong>
        </a>
        
        <button class="navbar-toggler" type="button" id="mobileToggle">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navLinks">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/lookup}">Tra cứu vé</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#offers">Ưu đãi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"     href="#">Hỗ trợ</a>
                </li>
            </ul>
            
            <ul class="navbar-nav ms-5">
                <!-- If Not Authenticated -->
                <th:block th:unless="${session.user != null}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/auth/login}">Đăng nhập</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-light btn-sm mt-1 ml-2" style="color: #c0392b; font-weight: 600;" th:href="@{/auth/register}">Đăng ký</a>
                    </li>
                </th:block>
                
                <!-- If Authenticated -->
                <th:block th:if="${session.user != null}">
                    <li class="nav-item dropdown ml-5">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i data-lucide="user-circle" class="mr-1"></i>
                            <span th:text="${session.user.fullName}">User</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                            <a class="dropdown-item" th:href="@{/profile/view}">Hồ sơ</a>
                            <div class="dropdown-divider"></div>
                            <form th:action="@{/auth/logout}" method="POST" class="m-0 px-3 py-1">
                                <button type="submit" class="btn btn-link text-danger p-0 w-100 text-left" style="text-decoration: none;">Đăng xuất</button>
                            </form>
                        </div>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
    
    <style>
        #userNavbar .nav-link { color: rgba(255,255,255,0.9); font-weight: 500; }
        #userNavbar .nav-link:hover, #userNavbar .nav-item.active .nav-link { color: #fff; }
        @media (max-width: 767px) {
            #navLinks { display: none; width: 100%; }
            #navLinks.active { display: block; }
        }
    </style>
    <script>
        window.addEventListener('scroll', function() {
            var nav = document.getElementById('userNavbar');
            if (nav) {
                if (window.scrollY > 10) nav.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';
                else nav.style.boxShadow = 'none';
            }
        });
    </script>
</nav>
</body>
</html>
