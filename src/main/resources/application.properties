spring.application.name=IT210-TicketBus

# Logging configuration to avoid conflicts
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.example.it210ticketbus=DEBUG

# thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# datasource
spring.datasource.url=jdbc:mysql://localhost:3306/Booking_Car?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456

# jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.show_sql=true
spring.jpa.properties.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

#cau hinh upload file
servlet.multipart.max-file-size=25MB
servlet.multipart.max-request-size=50MB

server.port=8080

# Session configuration
server.servlet.session.timeout=120m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.max-age=7200

# JPA session factory
spring.jpa.open-in-view=false

# Cấu hình Thread Pool cho xử lý bất đồng bộ (@Async)
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100